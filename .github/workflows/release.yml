name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build bundled audio libraries
        run: scripts/build-audio.sh
      - name: Build ad-hoc signed app
        run: go tool mygo build -platform darwin/arm64 -skip-dmg
      - name: Preserve bundle permissions
        run: ditto -c -k --sequesterRsrc --keepParent "build/darwin-arm64/MyGo Music Lite.app" build/mygo-music-lite.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mygo-music-lite-arm64
          path: build/mygo-music-lite.zip
